name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No `npm ci`: scripts/check-*.mjs import only node builtins and repo
      # files, so installing Electron here would download ~100 MB for nothing.
      - name: Checks
        run: npm run check
      - name: Release notes
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > release-notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
